VERBS.push(["bite","bit","bitten"],["fight","fought","fought"],["find","found","found"],["fly","flew","flown"],["forget","forgot","forgotten"],["get","got","got"],["give","gave","given"],["grow","grew","grown"],["hide","hid","hidden"],["hold","held","held"],["hurt","hurt","hurt"],["keep","kept","kept"],["lay","laid","laid"],["learn","learnt/learned","learnt/learned"],["let","let","let"],["lose","lost","lost"],["mean","meant","meant"],["meet","met","met"]);
VERBS.push(["pay","paid","paid"],["put","put","put"],["read","read","read"],["ride","rode","ridden"],["ring","rang","rung"],["run","ran","run"],["say","said","said"],["sell","sold","sold"],["send","sent","sent"],["set","set","set"],["shoot","shot","shot"],["show","showed","shown"],["shut","shut","shut"],["sing","sang","sung"],["sink","sank","sunk"],["sit","sat","sat"],["sleep","slept","slept"]);
VERBS.push(["smell","smelt/smelled","smelt/smelled"],["speak","spoke","spoken"],["spend","spent","spent"],["stand","stood","stood"],["steal","stole","stolen"],["sweep","swept","swept"],["swim","swam","swum"],["take","took","taken"],["teach","taught","taught"],["tell","told","told"],["throw","threw","thrown"],["understand","understood","understood"],["wake","woke","woken"],["wear","wore","worn"],["win","won","won"],["write","wrote","written"]);
var state=JSON.parse(localStorage.getItem("englishMastery")||"null")||{xp:0,level:1,streak:0,hearts:5,dark:false,mastery:{},answered:0,correct:0,seconds:0,attempts:0,ach:{}};
function save(){localStorage.setItem("englishMastery",JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lvl(){return Math.max(1,Math.floor(state.xp/250)+1)}
function doneCount(){return Object.values(state.mastery).filter(function(x){return x>0}).length}
function goldCount(){return Object.values(state.mastery).filter(function(x){return x>=3}).length}
function toast(t){var x=document.getElementById("toast");x.textContent=t;x.classList.add("on");setTimeout(function(){x.classList.remove("on")},1500)}
function beep(ok){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?720:180;o.type="sine";g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08);setTimeout(function(){c.close()},140)}catch(e){}}
function updateTop(){document.getElementById("xp").textContent=state.xp;document.getElementById("level").textContent=state.level;document.getElementById("streak").textContent=state.streak;document.getElementById("hearts").textContent=state.hearts}

function activate(id){document.querySelectorAll(".view").forEach(function(v){v.classList.remove("active")});document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach(function(b){b.classList.toggle("active",b.dataset.v===id)})}
function renderHome(){
 activate("home");
 var pct=Math.round(doneCount()/30*100);
 document.getElementById("home").innerHTML='<div class="hero"><h1>Build English mastery.</h1><p>Six units. Thirty lessons. Randomized practice. Offline progress.</p><div class="bar"><i style="width:'+pct+'%"></i></div><div style="margin-top:8px">'+pct+'% complete</div></div>'+
 '<div class="metrics"><div class="metric"><span class="small">XP</span><b>'+state.xp+'</b></div><div class="metric"><span class="small">Accuracy</span><b>'+(state.answered?Math.round(state.correct/state.answered*100):0)+'%</b></div><div class="metric"><span class="small">Lessons</span><b>'+doneCount()+'/30</b></div><div class="metric"><span class="small">Gold</span><b>'+goldCount()+'</b></div></div>'+
 '<div class="grid" style="margin-top:16px">'+UNITS.map(function(u,ui){return '<div class="card"><div class="tag">Unit '+(ui+1)+'</div><h3>'+u.icon+' '+esc(u.title)+'</h3><p class="small">'+esc(u.summary)+'</p><div class="lessons">'+u.lessons.map(function(n,i){var m=state.mastery[u.id+"-"+i]||0;return '<div class="lesson '+(m>=3?'gold':'')+'" onclick="startLesson(&quot;'+u.id+'&quot;,'+i+')"><span><b>Lesson '+(i+1)+'</b> · '+esc(n)+'<br><span class="small">'+(m>=3?'Gold':m?'Mastery '+m:'Not started')+' · 10 questions</span></span><span>'+ (m>=3?'★':m?'●':'○')+'</span></div>'}).join("")+'</div></div>'}).join("")+'</div>';
}
function renderStats(){
 activate("stats");
 document.getElementById("stats").innerHTML='<div class="card"><h2>Statistics</h2><div class="metrics"><div class="metric"><span class="small">XP</span><b>'+state.xp+'</b></div><div class="metric"><span class="small">Level</span><b>'+state.level+'</b></div><div class="metric"><span class="small">Answers</span><b>'+state.answered+'</b></div><div class="metric"><span class="small">Accuracy</span><b>'+(state.answered?Math.round(state.correct/state.answered*100):0)+'%</b></div></div><h3>Unit progress</h3>'+UNITS.map(function(u){var n=0;for(var i=0;i<5;i++)if((state.mastery[u.id+"-"+i]||0)>0)n++;return '<p><b>'+esc(u.title)+'</b> — '+n+'/5</p><div class="bar"><i style="width:'+(n*20)+'%;background:'+u.color+'"></i></div>'}).join("")+'</div>';
}
function renderAch(){
 activate("ach");
 var list=[["first","First Lesson","Complete one lesson"],["perfect","Perfect 10","Score 10/10"],["five","Five Lessons","Complete five lessons"],["gold","Golden Lesson","Reach mastery level 3"],["xp","1000 XP","Earn 1000 XP"],["review","Master Review","Complete a review lesson"]];
 document.getElementById("ach").innerHTML='<div class="grid">'+list.map(function(a){return '<div class="card"><div style="font-size:30px">'+(state.ach[a[0]]?'🏅':'🔒')+'</div><h3>'+a[1]+'</h3><p class="small">'+a[2]+'</p></div>'}).join("")+'</div>';
}

function renderSources(){
 activate("sources");
 var links=SOURCES.map(function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>'}).join("");
 var vt=VERBS.map(function(v){return '<tr><td>'+v[0]+'</td><td>'+v[1]+'</td><td>'+v[2]+'</td></tr>'}).join("");
 document.getElementById("sources").innerHTML='<div class="card sources"><h2>Sources & supplemental image material</h2><p>Primary educational content is based on authoritative grammar and sustainability sources. The uploaded images are supplemental.</p><h3>Reliable sources</h3><ul>'+links+'</ul><h3>Image-specific examples</h3><p>The notebook includes passive transformations such as “We will watch a Spider-Man movie next week” → “A movie will be watched by us next week” and “Gio watched Batman movie last year” → “Batman movie was watched by Gio last year”. It also lists modal meanings including could, might, should, had better, can, may, must and have to. Natural grammar is corrected where needed.</p><p>The printed page contributes irregular-verb forms used for reinforcement.</p><table style="width:100%;border-collapse:collapse"><tr><th>Infinitive</th><th>Past</th><th>Participle</th></tr>'+vt+'</table></div>';
}
document.querySelectorAll(".nav").forEach(function(b){b.onclick=function(){var id=b.dataset.v;if(id==="home")renderHome();if(id==="stats")renderStats();if(id==="ach")renderAch();if(id==="sources")renderSources()}})
document.getElementById("darkBtn").onclick=function(){state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);save()}

var session=null;
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function startLesson(uid,li){
 var u=UNITS.find(function(x){return x.id===uid});
 session={u:u,li:li,key:uid+"-"+li,qs:shuffle(BANK[uid+"-"+li]).slice(0,10),i:0,score:0,hearts:5,start:Date.now(),locked:false};
 renderIntro();
}
function renderIntro(){
 activate("lessonView");var u=session.u;
 document.getElementById("lessonView").innerHTML='<div class="card"><div class="learn"><div><div class="tag">'+esc(u.title)+'</div><h2>Lesson '+(session.li+1)+': '+esc(u.lessons[session.li])+'</h2></div><button class="btn alt" onclick="renderHome()">Exit</button></div><h3>Learning objectives</h3><ul>'+u.objectives.map(esc).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul><h3>Topic summary</h3><p>'+esc(u.summary)+'</p><h3>Examples</h3><ul>'+u.examples.map(esc).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul><h3>Key notes</h3><ul>'+u.notes.map(esc).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul><h3>Common mistakes</h3><ul>'+u.mistakes.map(esc).map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul><button class="btn" onclick="nextQ()">Start 10 questions</button></div>';
 state.attempts++;save();
}
function nextQ(){if(session.i>=10){finishLesson();return}renderQ()}
function renderQ(){
 session.locked=false;activate("lessonView");var q=session.qs[session.i];
 var ui="";
 if(q.type==="mc"||q.type==="tf"||q.type==="match")ui='<div class="answers">'+q.options.map(function(o,i){return '<button class="answer" onclick="answer('+i+',this)">'+esc(o)+'</button>'}).join("")+'</div>';
 else if(q.type==="flashcard")ui='<div class="card" style="background:#f4f7fb"><p>Think first. Reveal the back of the card when ready.</p><button class="btn" onclick="revealCard()">Reveal answer</button><div id="flashBack"></div></div>';
 else if(q.type==="order")ui='<p class="small">Drag the words into the correct order.</p><div id="orderArea" class="answers"></div><div id="wordBank" class="answers"></div><div style="margin-top:10px"><button class="btn" onclick="checkOrder()">Check order</button></div>';
 else ui='<input class="input" id="ans" placeholder="'+(q.type==="fill"?"Type the missing word":"Write the answer")+'"><div style="margin-top:10px"><button class="btn" onclick="shortAnswer()">Check</button></div>';
 document.getElementById("lessonView").innerHTML='<div class="card"><div class="learn"><div><div class="tag">'+esc(session.u.title)+' · Question '+(session.i+1)+'/10</div><div class="small">❤ '+session.hearts+' · Score '+session.score+'</div></div><button class="btn alt" onclick="renderHome()">Quit</button></div><div class="bar" style="margin-top:12px"><i style="width:'+(session.i*10)+'%;background:'+session.u.color+'"></i></div><div class="tag" style="margin-top:22px">'+esc(q.type)+'</div><div class="question">'+esc(q.prompt)+'</div>'+ui+'<div id="fb"></div></div>';
 if(q.type==="order"){var area=document.getElementById("wordBank"),target=document.getElementById("orderArea");target.ondragover=function(e){e.preventDefault()};target.ondrop=function(e){e.preventDefault();var w=e.dataTransfer.getData("text");if(w){var x=document.createElement("span");x.className="chip";x.textContent=w;target.appendChild(x);}};q.tokens.forEach(function(w){var c=document.createElement("button");c.className="answer";c.draggable=true;c.textContent=w;c.ondragstart=function(e){e.dataTransfer.setData("text",w)};c.onclick=function(){var x=document.createElement("span");x.className="chip";x.textContent=w;target.appendChild(x);c.remove()};area.appendChild(c)});}
}
function norm(s){return String(s).toLowerCase().trim().replace(/[.,!?;:]/g,"").replace(/\s+/g," ")}
function answer(i,el){if(session.locked)return;var q=session.qs[session.i],ok=norm(q.options[i])===norm(q.answer);document.querySelectorAll(".answer").forEach(function(x){x.disabled=true});el.classList.add(ok?"correct":"wrong");grade(ok,q)}
function revealCard(){var q=session.qs[session.i];document.getElementById("flashBack").innerHTML="<p><b>Answer:</b> "+esc(q.answer)+"</p><button class='btn' onclick='grade(true,qDummy())'>I knew it</button> <button class='btn alt' onclick='grade(false,qDummy())'>I did not know</button>"}
function qDummy(){return session.qs[session.i]}
function checkOrder(){var q=session.qs[session.i],built=Array.from(document.querySelectorAll("#orderArea .chip")).map(function(x){return x.textContent}).join(" ");grade(norm(built)===norm(q.answer),q)}
function shortAnswer(){if(session.locked)return;var q=session.qs[session.i],v=document.getElementById("ans").value,ok=norm(v)===norm(q.answer);grade(ok,q)}
function grade(ok,q){
 session.locked=true;if(ok){session.score++;state.correct++;state.xp+=10}else{session.hearts--;state.hearts=session.hearts}
 state.answered++;state.level=lvl();beep(ok);save();updateTop();
 document.getElementById("fb").innerHTML='<div class="feedback"><b>'+ (ok?"Correct":"Not quite") +'</b><p>'+esc(q.explanation)+'</p><p>Answer: <b>'+esc(q.answer)+'</b></p><button class="btn" onclick="advance()">'+(session.i===9?"Finish":"Continue")+'</button></div>';
}
function advance(){session.i++;if(session.i<10)renderQ();else finishLesson()}
function finishLesson(){
 var key=session.key,old=state.mastery[key]||0;state.mastery[key]=Math.min(3,old+1);
 state.xp+=session.score*5;state.level=lvl();state.streak=Math.max(1,state.streak);state.seconds+=Math.round((Date.now()-session.start)/1000);
 if(session.score===10)state.ach.perfect=true;if(doneCount()>=1)state.ach.first=true;if(doneCount()>=5)state.ach.five=true;if(state.mastery[key]>=3)state.ach.gold=true;if(state.xp>=1000)state.ach.xp=true;if(session.u.id==="review")state.ach.review=true;
 save();updateTop();activate("lessonView");
 document.getElementById("lessonView").innerHTML='<div class="card" style="text-align:center"><div style="font-size:54px">'+(state.mastery[key]>=3?"🏆":"✅")+'</div><h2>Lesson complete</h2><p><b>'+session.score+'/10</b> correct</p><div class="metrics"><div class="metric"><span class="small">Mastery</span><b>Level '+state.mastery[key]+'</b></div><div class="metric"><span class="small">XP</span><b>'+state.xp+'</b></div><div class="metric"><span class="small">Accuracy</span><b>'+session.score*10+'%</b></div><div class="metric"><span class="small">Hearts</span><b>'+session.hearts+'</b></div></div><div class="toolbar" style="justify-content:center"><button class="btn" onclick="startLesson(&quot;'+session.u.id+'&quot;,'+session.li+')">Replay</button><button class="btn alt" onclick="renderHome()">Course</button></div></div>';
}
state.level=lvl();if(state.dark)document.body.classList.add("dark");updateTop();renderHome();
</script></body></html>
