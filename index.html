<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoLearn - Inglés Interactivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --primary: #58cc02;
            --primary-shadow: #58a700;
            --secondary: #1cb0f6;
            --secondary-shadow: #1899d6;
            --danger: #ff4b4b;
            --danger-shadow: #ea2b2b;
            --danger-bg: #ffdfe0;
            --success-bg: #d7ffb8;
            --gold: #ffc800;
            --gold-shadow: #e5b400;
            --gray: #e5e5e5;
            --gray-shadow: #afafaf;
            --text-main: #4b4b4b;
            --text-light: #777;
            --bg-main: #ffffff;
            --font-main: 'Nunito', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: white;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid var(--gray);
            background: white;
            z-index: 10;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-item.streak { color: #ff9600; }
        .stat-item.xp { color: var(--secondary); }
        .stat-item.hearts { color: var(--danger); }
        .stat-icon { margin-right: 5px; font-size: 1.3rem; }

        /* --- SCREENS --- */
        .screen {
            display: none;
            flex: 1;
            overflow-y: auto;
            flex-direction: column;
        }
        .screen.active {
            display: flex;
        }

        /* --- HOME SCREEN (PATH) --- */
        #home-screen {
            padding: 40px 20px;
            align-items: center;
            background: #f7f7f7;
        }
        
        .section-header {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 4px 0 var(--primary-shadow);
        }

        .node-container {
            position: relative;
            margin: 15px 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .lesson-node {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 8px 0 var(--primary-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
            z-index: 2;
        }

        .lesson-node:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 var(--primary-shadow);
        }

        .lesson-node.gold {
            background: var(--gold);
            box-shadow: 0 8px 0 var(--gold-shadow);
        }

        .lesson-title-bubble {
            position: absolute;
            top: -40px;
            background: white;
            padding: 5px 12px;
            border-radius: 10px;
            border: 2px solid var(--gray);
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            pointer-events: none;
        }
        .node-container:hover .lesson-title-bubble {
            opacity: 1;
            transform: translateY(0);
        }

        .crown-indicator {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: white;
            border: 2px solid var(--gray);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: var(--gold);
        }

        /* --- THEORY SCREEN --- */
        #theory-screen {
            padding: 30px 20px;
        }
        .theory-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-main);
        }
        .theory-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            background: #f7f7f7;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gray);
        }
        .theory-content b {
            color: var(--primary-shadow);
        }

        /* --- QUIZ SCREEN --- */
        #quiz-screen {
            padding: 20px;
            padding-bottom: 150px;
            position: relative;
        }

        .progress-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .close-btn {
            font-size: 1.5rem;
            color: var(--gray-shadow);
            cursor: pointer;
            margin-right: 15px;
            font-weight: 800;
        }
        .progress-bar {
            flex: 1;
            height: 16px;
            background: var(--gray);
            border-radius: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 8px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            background: white;
            border: 2px solid var(--gray);
            border-bottom: 4px solid var(--gray);
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
        }
        .option-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .option-btn.selected {
            border-color: var(--secondary);
            background: #e1f5fe;
            color: var(--secondary-shadow);
        }

        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            border-top: 2px solid var(--gray);
            background: white;
            display: flex;
            flex-direction: column;
            transition: background 0.3s;
            z-index: 20;
        }
        .footer-bar.correct { background: var(--success-bg); border-top-color: #b9eaa6; }
        .footer-bar.incorrect { background: var(--danger-bg); border-top-color: #ffc4c6; }

        .feedback-message {
            display: none;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .footer-bar.correct .feedback-message { display: block; color: var(--primary-shadow); }
        .footer-bar.incorrect .feedback-message { display: block; color: var(--danger-shadow); }

        .action-btn {
            background: var(--gray);
            color: var(--text-light);
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: not-allowed;
            border-bottom: 4px solid var(--gray-shadow);
            transition: all 0.1s;
            width: 100%;
        }
        .action-btn.active {
            background: var(--primary);
            color: white;
            border-bottom-color: var(--primary-shadow);
            cursor: pointer;
        }

        #summary-screen {
            padding: 40px 20px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .summary-title { font-size: 2.3rem; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
        .stats-container { display: flex; gap: 20px; margin: 30px 0; width: 100%; justify-content: center; }
        .stat-box { background: white; border: 2px solid var(--gray); border-radius: 15px; padding: 20px; flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; }
        .stat-box-title { font-size: 0.9rem; font-weight: 700; color: var(--text-light); margin-bottom: 10px; }
        .stat-box-value { font-size: 1.8rem; font-weight: 800; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 15px; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; cursor: pointer; border-bottom: 4px solid var(--primary-shadow); width: 100%; max-width: 300px; }
    </style>
</head>
<body>

<div id="app-container">
    <header class="navbar">
        <div class="stat-item streak"><span class="stat-icon">🔥</span> <span id="nav-streak">1</span></div>
        <div class="stat-item xp"><span class="stat-icon">⚡</span> <span id="nav-xp">0</span></div>
        <div class="stat-item hearts"><span class="stat-icon">❤️</span> <span id="nav-hearts">5</span></div>
    </header>

    <main id="home-screen" class="screen active">
        <div class="section-header"><span>Cuaderno & Libro</span><span>Temas Actuales</span></div>
        <div id="path-container" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
    </main>

    <main id="theory-screen" class="screen">
        <h2 class="theory-title" id="theory-title"></h2>
        <div class="theory-content" id="theory-content"></div>
        <button class="btn-primary" onclick="startQuiz()" style="margin: 0 auto; display: block;">¡Empezar Práctica!</button>
    </main>

    <main id="quiz-screen" class="screen">
        <div class="progress-container">
            <span class="close-btn" onclick="returnToHome()">×</span>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div id="question-area">
            <h2 class="question-title" id="question-title"></h2>
            <div class="options-grid" id="mc-container"></div>
        </div>
        <div class="footer-bar" id="footer-bar">
            <div class="feedback-message" id="feedback-message"></div>
            <button class="action-btn" id="action-btn" onclick="handleAction()">Comprobar</button>
        </div>
    </main>

    <main id="summary-screen" class="screen">
        <h2 class="summary-title">¡Lección Completada!</h2>
        <div class="stats-container">
            <div class="stat-box xp"><span class="stat-box-title">XP</span><span class="stat-box-value" id="summary-xp">0</span></div>
        </div>
        <button class="btn-primary" onclick="returnToHome()">Continuar</button>
    </main>
</div>

<script>
    const appState = { xp: 0, streak: 1, hearts: 5, currentLessonId: null, currentQuestionIndex: 0, selectedAnswer: null };

    // Contenido basado estrictamente en tus notas e imágenes del cuaderno
    const lessonsData = [
        {
            id: 'l1',
            title: 'Passive Voice (Present Simple)',
            icon: '🏛️',
            completions: 1,
            theory: '<b>Voz Pasiva (Presente Simple):</b> Se usa para cambiar el foco de la oración, enfocándose en el objeto.<br><b>Estructura:</b> Object + am/is/are + Past Participle.<br><i>Ejemplo:</i> The story <b>is written</b>.',
            questions: [
                { text: 'Transform to passive: "The author writes a story."', options: ['The story is written.', 'The story was written.', 'A story writes.'], answer: 0 },
                { text: 'Choose the correct negative passive form:', options: ['The actors aren\'t announced', 'The actors isn\'t announce', 'The actors don\'t announce'], answer: 0 }
            ]
        },
        {
            id: 'l2',
            title: 'Past Perfect vs Past Simple',
            icon: '⏳',
            completions: 1,
            theory: '<b>Past Perfect:</b> Muestra una acción que ocurrió <i>antes</i> de otra en el pasado simple.<br><b>Estructura:</b> had + Past Participle.<br><i>Ejemplo:</i> When we arrived, the film <b>had started</b>.',
            questions: [
                { text: 'Complete: "I tried to buy my ticket but I ___ lost my money."', options: ['had', 'have', 'was'], answer: 0 },
                { text: '¿Qué acción ocurrió primero en: "When we arrived, the film had started"?', options: ['Llegar al cine', 'Que la película empezara', 'Ocurrieron al mismo tiempo'], answer: 1 }
            ]
        },
        {
            id: 'l3',
            title: 'Modal Verbs',
            icon: '🗣️',
            completions: 1,
            theory: '<b>Modal Verbs:</b> Expresan certeza, posibilidad, habilidad o consejo.<br>• <b>Should:</b> Advice (consejo)<br>• <b>Must:</b> Obligation<br>• <b>Could:</b> Ability, permission, possibility',
            questions: [
                { text: 'Which modal verb is used for "Advice" (consejo)?', options: ['Should', 'Must', 'Had to'], answer: 0 },
                { text: 'Which modal expresses strong advice according to your notes?', options: ['Had better', 'Can', 'Might'], answer: 0 }
            ]
        },
        {
            id: 'l4',
            title: 'Sustainable Food',
            icon: '🌱',
            completions: 1,
            theory: '<b>Sostenibilidad Alimentaria:</b><br>• El alimento que genera más calentamiento global (worst food) es la carne de res (<b>beef</b>) por sus altas emisiones y uso de suelo.<br>• Ingredientes recomendados: Nuts, citrus, apples.',
            questions: [
                { text: 'What is the worst food for global warming according to your notes?', options: ['Beef', 'Apples', 'Nuts'], answer: 0 },
                { text: 'Which of these are good ingredients for the environment?', options: ['Nuts, citrus, apples', 'Beef and cheese', 'Sheep'], answer: 0 }
            ]
        }
    ];

    function renderHome() {
        const container = document.getElementById('path-container');
        container.innerHTML = '';
        lessonsData.forEach((l) => {
            const wrap = document.createElement('div');
            wrap.className = 'node-container';
            wrap.innerHTML = `<div class="lesson-node gold" onclick="openTheory('${l.id}')">${l.icon}<div class="lesson-title-bubble">${l.title}</div><div class="crown-indicator">✓</div></div>`;
            container.appendChild(wrap);
        });
        switchScreen('home-screen');
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openTheory(id) {
        appState.currentLessonId = id;
        const lesson = lessonsData.find(l => l.id === id);
        document.getElementById('theory-title').innerText = lesson.title;
        document.getElementById('theory-content').innerHTML = lesson.theory;
        switchScreen('theory-screen');
    }

    function startQuiz() {
        appState.currentQuestionIndex = 0;
        renderQuestion();
        switchScreen('quiz-screen');
    }

    function renderQuestion() {
        appState.selectedAnswer = null;
        const footer = document.getElementById('footer-bar');
        footer.className = 'footer-bar';
        document.getElementById('feedback-message').innerText = '';
        document.getElementById('action-btn').innerText = 'Comprobar';
        document.getElementById('action-btn').className = 'action-btn';

        const lesson = lessonsData.find(l => l.id === appState.currentLessonId);
        const q = lesson.questions[appState.currentQuestionIndex];
        
        // Progress bar
        const progress = ((appState.currentQuestionIndex) / lesson.questions.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;

        document.getElementById('question-title').innerText = q.text;
        const container = document.getElementById('mc-container');
        container.innerHTML = '';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                appState.selectedAnswer = i;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('action-btn').classList.add('active');
            };
            container.appendChild(btn);
        });
    }

    function handleAction() {
        if (appState.selectedAnswer === null) return;
        
        const lesson = lessonsData.find(l => l.id === appState.currentLessonId);
        const q = lesson.questions[appState.currentQuestionIndex];
        const footer = document.getElementById('footer-bar');
        const btn = document.getElementById('action-btn');

        if (appState.selectedAnswer === q.answer) {
            footer.classList.add('correct');
            document.getElementById('feedback-message').innerText = '¡Excelente!';
            btn.innerText = 'Continuar';
            btn.onclick = nextStep;
        } else {
            footer.classList.add('incorrect');
            document.getElementById('feedback-message').innerText = 'Incorrecto';
            appState.hearts = Math.max(0, appState.hearts - 1);
            document.getElementById('nav-hearts').innerText = appState.hearts;
            btn.innerText = 'Continuar';
            btn.onclick = nextStep;
        }
    }

    function nextStep() {
        const lesson = lessonsData.find(l => l.id === appState.currentLessonId);
        appState.currentQuestionIndex++;
        
        if (appState.currentQuestionIndex < lesson.questions.length) {
            renderQuestion();
            document.getElementById('action-btn').onclick = handleAction;
        } else {
            appState.xp += 20;
            document.getElementById('nav-xp').innerText = appState.xp;
            document.getElementById('summary-xp').innerText = appState.xp;
            switchScreen('summary-screen');
        }
    }

    function returnToHome() {
        renderHome();
    }

    window.onload = renderHome;
</script>
</body>
</html>
