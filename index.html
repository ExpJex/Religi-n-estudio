<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaQuest - Duolingo-Inspired Learning App</title>
    <style>
        :root {
            --bg-color: #131f24;
            --surface-color: #202f36;
            --surface-border: #37464f;
            --text-color: #ffffff;
            --text-secondary: #afbfe1;
            --primary-color: #58cc02;
            --primary-hover: #46a302;
            --primary-border: #58a700;
            --danger-color: #ff4b4b;
            --danger-hover: #ea2b2b;
            --danger-border: #d33131;
            --gold-color: #ffc800;
            --gold-border: #dfb200;
            --blue-color: #1cb0f6;
            --blue-hover: #1899d6;
            --card-shadow: 0 4px 0 var(--surface-border);
            --button-shadow: 0 4px 0 var(--primary-border);
            --danger-shadow: 0 4px 0 var(--danger-border);
            --gold-shadow: 0 4px 0 var(--gold-border);
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --surface-color: #f7f7f7;
            --surface-border: #e5e5e5;
            --text-color: #4b4b4b;
            --text-secondary: #777777;
            --primary-color: #58cc02;
            --primary-hover: #46a302;
            --primary-border: #46a302;
            --danger-color: #ff4b4b;
            --danger-hover: #ea2b2b;
            --danger-border: #d33131;
            --gold-color: #ffc800;
            --gold-border: #dfb200;
            --blue-color: #1cb0f6;
            --blue-hover: #1899d6;
            --card-shadow: 0 4px 0 #e5e5e5;
            --button-shadow: 0 4px 0 #46a302;
            --danger-shadow: 0 4px 0 #d33131;
            --gold-shadow: 0 4px 0 #dfb200;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        sidebar {
            width: 256px;
            border-right: 2px solid var(--surface-border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            padding-left: 12px;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            border: 2px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--surface-color);
            color: var(--text-color);
        }

        .nav-item.active {
            background-color: rgba(88, 204, 2, 0.1);
            color: var(--primary-color);
            border-color: rgba(88, 204, 2, 0.3);
        }

        .main-content {
            margin-left: 256px;
            flex-grow: 1;
            padding: 24px 32px;
            max-width: calc(100% - 256px);
        }

        /* Top Header Stats */
        .top-stats {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--surface-border);
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
        }

        .stat-badge span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Buttons & UI Elements */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-danger {
            background-color: var(--danger-color);
            box-shadow: var(--danger-shadow);
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-blue {
            background-color: var(--blue-color);
            box-shadow: 0 4px 0 #1899d6;
        }
        .btn-blue:hover {
            background-color: var(--blue-hover);
        }

        /* Curriculum Path View */
        .units-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            padding-bottom: 60px;
        }

        .unit-section {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .unit-header {
            width: 100%;
            background: linear-gradient(135deg, var(--surface-color), var(--surface-border));
            padding: 20px 24px;
            border-radius: 20px;
            border: 2px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
        }

        .unit-title h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .unit-title p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .lesson-path {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .path-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .path-row.offset-1 {
            transform: translateX(-40px);
        }
        .path-row.offset-2 {
            transform: translateX(40px);
        }

        .lesson-node {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: var(--surface-border);
            border: 6px solid var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .lesson-node.unlocked {
            background-color: var(--primary-color);
            border-color: #46a302;
            cursor: pointer;
        }

        .lesson-node.completed {
            background-color: var(--primary-color);
            border-color: #46a302;
        }

        .lesson-node.gold {
            background-color: var(--gold-color);
            border-color: var(--gold-border);
            box-shadow: 0 6px 0 #b38b00;
        }

        .lesson-node:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Lesson Theory & Modal Screen */
        .screen {
            display: none;
            width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .theory-card {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .theory-card h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .theory-section h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .theory-section p, .theory-section li {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .theory-section ul {
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .example-box {
            background-color: var(--bg-color);
            border-left: 4px solid var(--primary-color);
            padding: 12px 16px;
            border-radius: 0 12px 12px 0;
            font-style: italic;
            margin: 8px 0;
        }

        /* Interactive Quiz Arena */
        .quiz-container {
            max-width: 650px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .quiz-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 16px;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--surface-border);
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .hearts-display {
            display: flex;
            gap: 6px;
            font-size: 20px;
        }

        .quiz-card {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .quiz-question {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 2px solid var(--surface-border);
            border-bottom-width: 4px;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background-color: var(--surface-border);
        }

        .option-btn.selected {
            border-color: var(--blue-color);
            background-color: rgba(28, 176, 246, 0.1);
        }

        .option-btn.correct {
            border-color: var(--primary-color) !important;
            background-color: rgba(88, 204, 2, 0.15) !important;
            color: var(--primary-color);
        }

        .option-btn.incorrect {
            border-color: var(--danger-color) !important;
            background-color: rgba(255, 75, 75, 0.15) !important;
            color: var(--danger-color);
        }

        /* Footer feedback bar */
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid var(--surface-border);
        }

        .feedback-banner {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feedback-banner.correct { color: var(--primary-color); }
        .feedback-banner.incorrect { color: var(--danger-color); }

        /* Dashboard & Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--card-shadow);
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .stat-card .label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Achievements */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .achievement-card {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--card-shadow);
        }

        .achievement-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .achievement-card.unlocked .achievement-icon {
            background-color: var(--gold-color);
            box-shadow: 0 4px 0 #b38b00;
        }

        .achievement-info h4 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .achievement-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Drag and Drop & Matching placeholders */
        .drag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            padding: 12px;
            background-color: var(--bg-color);
            border: 2px dashed var(--surface-border);
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .word-chip {
            background-color: var(--surface-color);
            border: 2px solid var(--surface-border);
            border-bottom-width: 4px;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-block;
        }

        .word-chip:hover {
            border-color: var(--blue-color);
        }

        /* Responsive */
        @media(max-width: 768px) {
            sidebar { width: 70px; padding: 16px 8px; }
            sidebar .logo span, sidebar .nav-item span { display: none; }
            .main-content { margin-left: 70px; max-width: calc(100% - 70px); padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <sidebar>
        <div>
            <div class="logo">
                <span>🦉</span> LinguaQuest
            </div>
            <div class="nav-links">
                <a class="nav-item active" onclick="switchTab('learn')">
                    <span>📚</span> <span>Learn</span>
                </a>
                <a class="nav-item" onclick="switchTab('dashboard')">
                    <span>📊</span> <span>Dashboard</span>
                </a>
                <a class="nav-item" onclick="switchTab('achievements')">
                    <span>🏆</span> <span>Achievements</span>
                </a>
                <a class="nav-item" onclick="toggleTheme()">
                    <span>🌓</span> <span>Theme</span>
                </a>
            </div>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary); padding-left: 12px;">
            Duolingo Inspired v2.6
        </div>
    </sidebar>

    <!-- Main Application View -->
    <div class="main-content">
        <!-- Top Persistent Stats Bar -->
        <div class="top-stats">
            <div class="stat-badge" title="Current Streak">
                <span>🔥</span> <span id="stat-streak">0</span> days
            </div>
            <div class="stat-badge" title="Total XP">
                <span>⚡</span> <span id="stat-xp">0</span> XP
            </div>
            <div class="stat-badge" title="Remaining Lives">
                <span>❤️</span> <span id="stat-lives">5</span>/5
            </div>
        </div>

        <!-- SCREEN 1: LEARN / CURRICULUM PATH -->
        <div id="screen-learn" class="screen active">
            <div class="units-container" id="units-container-render">
                <!-- Dynamically rendered units & lessons -->
            </div>
        </div>

        <!-- SCREEN 2: THEORY / PRE-LESSON INTRO -->
        <div id="screen-theory" class="screen">
            <div class="theory-card" id="theory-card-content">
                <!-- Dynamically rendered theory content -->
            </div>
        </div>

        <!-- SCREEN 3: QUIZ ARENA -->
        <div id="screen-quiz" class="screen">
            <div class="quiz-container">
                <div class="quiz-header">
                    <button class="btn btn-danger" style="padding: 8px 16px; font-size: 13px;" onclick="quitQuiz()">✕</button>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="quiz-progress-fill"></div>
                    </div>
                    <div class="hearts-display" id="quiz-hearts">❤️❤️❤️❤️❤️</div>
                </div>

                <div class="quiz-card">
                    <div class="quiz-question" id="quiz-question-text">Question loading...</div>
                    <div class="options-grid" id="quiz-options-container">
                        <!-- Options generated dynamically -->
                    </div>
                </div>

                <div class="quiz-footer">
                    <div class="feedback-banner" id="quiz-feedback"></div>
                    <button class="btn" id="quiz-action-btn" onclick="submitAnswer()">Check</button>
                </div>
            </div>
        </div>

        <!-- SCREEN 4: DASHBOARD & STATS -->
        <div id="screen-dashboard" class="screen">
            <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 24px;">Performance Dashboard</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="dash-total-xp">0</div>
                    <div class="label">Total Earned XP</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="dash-completed-lessons">0</div>
                    <div class="label">Lessons Completed</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="dash-accuracy">100%</div>
                    <div class="label">Overall Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="dash-mastery-count">0</div>
                    <div class="label">Gold Lessons (L3)</div>
                </div>
            </div>
        </div>

        <!-- SCREEN 5: ACHIEVEMENTS -->
        <div id="screen-achievements" class="screen">
            <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 24px;">Achievements & Badges</h1>
            <div class="achievements-grid" id="achievements-container">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </div>
</div>

<script>
    /* --- APPLICATION STATE & LOCALSTORAGE --- */
    const STORAGE_KEY = 'linguaquest_user_state_v26';
    
    let userState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        xp: 0,
        streak: 1,
        lives: 5,
        lastLogin: new Date().toDateString(),
        completedLessons: {}, // lessonId: masteryLevel (0 to 3)
        totalCorrect: 0,
        totalAnswered: 0,
        unlockedAchievements: []
    };

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
        updateTopStats();
    }

    function updateTopStats() {
        document.getElementById('stat-streak').innerText = userState.streak;
        document.getElementById('stat-xp').innerText = userState.xp;
        document.getElementById('stat-lives').innerText = userState.lives;
    }

    /* --- CURRICULUM & QUESTION DATA ENGINE --- */
    const CURRICULUM = [
        {
            id: 1,
            title: "Unit 1: Active Voice",
            description: "Master Subject-Verb-Object patterns and active sentence construction.",
            lessons: [
                { id: "1_1", title: "Introduction to Active Voice", theory: {
                    objectives: ["Understand subject-verb-object patterns", "Identify doers of actions"],
                    explanation: "In active voice, the subject performs the action expressed by the verb directly.",
                    summary: "Structure: Subject + Verb + Object. Essential for clear and direct communication.",
                    examples: ["The author writes a story.", "Abelardo won the elections."],
                    notes: ["Always check who performs the verb action."],
                    mistakes: ["Confusing active subjects with passive receivers."]
                }},
                { id: "1_2", title: "Subject-Verb-Object Patterns", theory: {
                    objectives: ["Analyze core sentence elements"],
                    explanation: "Every active sentence relies on a clear actor executing an action upon a receiver.",
                    summary: "The actor comes first, followed by the action verb and the direct object.",
                    examples: ["Mariana takes a shower.", "Sam brings an opinion."],
                    notes: ["Pronouns must match subject/object cases."],
                    mistakes: ["Omitting the direct object when required."]
                }},
                { id: "1_3", title: "Identifying Active Voice", theory: {
                    objectives: ["Spot active sentences instantly"],
                    explanation: "Active voice emphasizes who or what is doing the action.",
                    summary: "If the subject is doing the verb, it is active.",
                    examples: ["Gio watched Batman movie last year.", "Leticia had watched a movie yesterday."],
                    notes: ["Look for the agent at the beginning of the clause."],
                    mistakes: ["Mistaking past participle modifiers for passive voice."]
                }},
                { id: "1_4", title: "Converting Passive to Active", theory: {
                    objectives: ["Reverse passive structures into active ones"],
                    explanation: "To convert passive to active, take the agent from the 'by' phrase and make it the subject.",
                    summary: "Object of passive becomes Subject of active; remove auxiliary 'be' and past participle, restoring tense.",
                    examples: ["Passive: A movie will be watched by us -> Active: We will watch a movie.", "Passive: Sam brings an opinion -> Active: Sam brings an opinion."],
                    notes: ["Check tense consistency during transformation."],
                    mistakes: ["Forgetting to adjust verb forms back to active tenses."]
                }},
                { id: "1_5", title: "Real-World Active Application", theory: {
                    objectives: ["Apply active voice in daily writing"],
                    explanation: "Active voice makes essays, stories, and Roblox game dialogue punchy and engaging.",
                    summary: "Use active voice whenever you want direct, energetic prose.",
                    examples: ["Jero and Enciso have like Breaking Bad show since this year."],
                    notes: ["Preferred in creative storytelling."],
                    mistakes: ["Overusing passive voice in narrative contexts."]
                }}
            ]
        },
        {
            id: 2,
            title: "Unit 2: Passive Voice",
            description: "Focus on actions and receivers across present, past, and future tenses.",
            lessons: [
                { id: "2_1", title: "Passive Voice: Present Simple", theory: {
                    objectives: ["Form present simple passive"],
                    explanation: "Formed with object + am/is/are + past participle. Used when the doer is unknown or unimportant.",
                    summary: "The story is written.",
                    examples: ["The story is written.", "The actors aren't announced."],
                    notes: ["Use 'by' only when the agent is crucial."],
                    mistakes: ["Using base verbs instead of past participles."]
                }},
                { id: "2_2", title: "Passive Voice: Past & Future", theory: {
                    objectives: ["Apply past and future passive structures"],
                    explanation: "Past simple uses was/were + past participle; future uses will be + past participle.",
                    summary: "Batman movie was watched by Gio. A movie will be watched by us.",
                    examples: ["Batman movie was watched by Gio.", "A movie will be watched by us."],
                    notes: ["Ensure correct past participle from irregular verb charts."],
                    mistakes: ["Mixing up was and were with plural subjects."]
                }},
                { id: "2_3", title: "Active-to-Passive Transformations", theory: {
                    objectives: ["Master complete sentence flipping"],
                    explanation: "Move the direct object to the subject position, insert the correct form of 'be', and add past participle.",
                    summary: "Active: Abelardo won the elections -> Passive: The elections were won by Abelardo.",
                    examples: ["Sarah will write a love letter -> A love letter will be written by Sarah."],
                    notes: ["Pronouns change case (e.g., I -> me)."],
                    mistakes: ["Omission of the auxiliary verb 'be'."]
                }},
                { id: "2_4", title: "Agent Usage (by...)", theory: {
                    objectives: ["Determine when to include the agent"],
                    explanation: "Include 'by [agent]' only when knowing who performed the action adds specific value.",
                    summary: "Omit the agent if obvious or irrelevant.",
                    examples: ["The thief was arrested by the police."],
                    notes: ["Scientific and formal writing often drops the agent entirely."],
                    mistakes: ["Always forcing 'by someone' in passive sentences."]
                }},
                { id: "2_5", title: "Scientific & Formal Applications", theory: {
                    objectives: ["Use passive voice in academic contexts"],
                    explanation: "Passive voice shifts focus from the researcher to the experimental procedure or results.",
                    summary: "Essential for objective scientific reporting.",
                    examples: ["Experiments were conducted under controlled conditions."],
                    notes: ["Balances objectivity in technical papers."],
                    mistakes: ["Making sentences unnecessarily convoluted."]
                }}
            ]
        },
        {
            id: 3,
            title: "Unit 3: Modal Verbs",
            description: "Express ability, obligation, advice, possibility, and probability.",
            lessons: [
                { id: "3_1", title: "Introduction to Modals", theory: {
                    objectives: ["Define modal auxiliary verbs"],
                    explanation: "Modals show if we believe something is certain, possible, or impossible.",
                    summary: "Can, could, may, might, must, should, will, would, ought to.",
                    examples: ["We can talk about ability and permission."],
                    notes: ["Modals do not take an 's' in the third-person singular."],
                    mistakes: ["Adding 'to' directly after modal verbs (except ought to)."]
                }},
                { id: "3_2", title: "Permission and Request", theory: {
                    objectives: ["Ask for permission politely"],
                    explanation: "Use can, could, and may to request permission or favors.",
                    summary: "Could - Ability, permission, possibility. May - Possibility.",
                    examples: ["Could you help me with this task?", "May I leave the room?"],
                    notes: ["Could is more polite than can."],
                    mistakes: ["Using 'to' after could/may in requests."]
                }},
                { id: "3_3", title: "Advice and Obligation", theory: {
                    objectives: ["Give strong advice and state duties"],
                    explanation: "Use should and had better for advice; must and have to for obligation.",
                    summary: "Should - Advice. Must - Obligation.",
                    examples: ["You should study for the quiz.", "You must submit the assignment on time."],
                    notes: ["Have to implies external rules or forced situations."],
                    mistakes: ["Confusing must not (prohibition) with don't have to (no obligation)."]
                }},
                { id: "3_4", title: "Possibility and Probability", theory: {
                    objectives: ["Express degrees of certainty"],
                    explanation: "Might, may, and could indicate varying levels of uncertain possibility.",
                    summary: "Might - Possibility.",
                    examples: ["It might rain later today.", "She could win the competition."],
                    notes: ["Might suggests a lower probability than may."],
                    mistakes: ["Using must for past possibility without have."]
                }},
                { id: "3_5", title: "Real-Life Modals Error Correction", theory: {
                    objectives: ["Fix common modal errors"],
                    explanation: "Review real student workbook entries to eliminate grammar slip-ups.",
                    summary: "Always follow modals with bare infinitives.",
                    examples: ["Correct: You should go. Incorrect: You should to go."],
                    notes: ["Check notebook corrections."],
                    mistakes: ["Incorrect auxiliary pairing."]
                }}
            ]
        },
        {
            id: 4,
            title: "Unit 4: Past Perfect",
            description: "Sequence past events and master earlier actions.",
            lessons: [
                { id: "4_1", title: "Formation of Past Perfect", theory: {
                    objectives: ["Form past perfect correctly"],
                    explanation: "Use had + past participle to refer to an event that happened before another event in the past.",
                    summary: "Affirmative: had + V3. Negative: hadn't + V3. Question: Had + subject + V3?",
                    examples: ["When we arrived, the film had started.", "I had lost my money."],
                    notes: ["Requires an irregular past participle like seen, started, lost."],
                    mistakes: ["Using simple past instead of past perfect for the earlier action."]
                }},
                { id: "4_2", title: "Timelines & Event Sequencing", theory: {
                    objectives: ["Sequence two past actions"],
                    explanation: "The past perfect shows the earlier action, while the past simple shows the later action.",
                    summary: "Timeline: Past Perfect -> Past Simple -> Present.",
                    examples: ["Sam had talked her BF when the teacher arrived.", "Leticia had watched a movie yesterday."],
                    notes: ["Visualizing timelines clarifies sequence."],
                    mistakes: ["Reversing the order of clauses without adjusting conjunctions."]
                }},
                { id: "4_3", title: "Signal Words & Conjunctions", theory: {
                    objectives: ["Use when, before, after, already"],
                    explanation: "Conjunctions like before, after, already, and by the time anchor past perfect clauses.",
                    summary: "By the time he woke up, she had left.",
                    examples: ["Had your friends seen the film before?"],
                    notes: ["'Already' places emphasis on prior completion."],
                    mistakes: ["Misplacing time adverbs between auxiliary and main verb."]
                }},
                { id: "4_4", title: "Past Simple vs Past Perfect", theory: {
                    objectives: ["Contrast past simple and past perfect"],
                    explanation: "Past simple is for single completed actions; past perfect is for an action prior to another past action.",
                    summary: "The film started, then we arrived (Simple) vs When we arrived, the film had started (Perfect).",
                    examples: ["I lost my money, then I tried to buy a ticket."],
                    notes: ["Context dictates whether the time gap matters."],
                    mistakes: ["Overusing past perfect when simple past is sufficient."]
                }},
                { id: "4_5", title: "Real-Life Narrative Scenarios", theory: {
                    objectives: ["Write coherent past narratives"],
                    explanation: "Combine past simple and past perfect to tell compelling, error-free stories.",
                    summary: "Essential for recounting complex memories and personal experiences.",
                    examples: ["I had watched Breaking Bad last year."],
                    notes: ["Practice narrative writing regularly."],
                    mistakes: ["Inconsistent tense shifting across paragraphs."]
                }}
            ]
        },
        {
            id: 5,
            title: "Unit 5: Sustainable Food",
            description: "Explore environmental impact, sustainable diets, and local food systems.",
            lessons: [
                { id: "5_1", title: "Introduction to Sustainable Food", theory: {
                    objectives: ["Define sustainable food systems"],
                    explanation: "Sustainable food focuses on ecological preservation, fair trade, and minimizing carbon footprints.",
                    summary: "Dietary choices directly affect global warming, land use, and resource depletion.",
                    examples: ["The worst food for global warming is beef because it has high emissions."],
                    notes: ["Involves agricultural supply chains."],
                    mistakes: ["Ignoring lifecycle emissions of food items."]
                }},
                { id: "5_2", title: "Environmental Impact & Carbon Footprint", theory: {
                    objectives: ["Analyze greenhouse gas emissions of food"],
                    explanation: "Different foods produce drastically different environmental footprints.",
                    summary: "Meat and dairy production generate higher emissions than plant-based foods.",
                    examples: ["Beef and cheese have significant land-use impacts."],
                    notes: ["Transport and packaging also contribute."],
                    mistakes: ["Assuming all agricultural products have equal environmental impact."]
                }},
                { id: "5_3", title: "Local Systems & Seasonal Foods", theory: {
                    objectives: ["Understand benefits of local eating"],
                    explanation: "Eating locally and seasonally reduces transport emissions and supports community agriculture.",
                    summary: "Best ingredients for the environment often include nuts, citrus, and apples.",
                    examples: ["Choosing seasonal produce lowers refrigeration and shipping costs."],
                    notes: ["Farmers' markets enhance local economies."],
                    mistakes: ["Buying out-of-season produce shipped globally."]
                }},
                { id: "5_4", title: "Organic Practices & Waste Reduction", theory: {
                    objectives: ["Practice food waste reduction"],
                    explanation: "Organic farming avoids synthetic pesticides, while waste reduction tackles consumer surplus.",
                    summary: "Farming processes and distribution dictate overall food waste.",
                    examples: ["Composting food scraps and meal planning reduce household waste."],
                    notes: ["Animal feet and farming distribution metrics matter in lifecycle assessments."],
                    mistakes: ["Over-purchasing perishable goods."]
                }},
                { id: "5_5", title: "Ethical Consumption & Modal Conclusions", theory: {
                    objectives: ["Summarize sustainability conclusions with modal verbs"],
                    explanation: "Use modal verbs to formulate policy and lifestyle recommendations for sustainable eating.",
                    summary: "We must protect resources; we should choose sustainable diets.",
                    examples: ["We must reduce beef consumption to lower carbon footprints."],
                    notes: ["Combine grammar and environmental awareness."],
                    mistakes: ["Failing to use correct modal verbs in conclusions."]
                }}
            ]
        },
        {
            id: 6,
            title: "Unit 6: Master Review",
            description: "Combine active voice, passive voice, modals, past perfect, and sustainable food.",
            lessons: [
                { id: "6_1", title: "Voice Mastery Challenge", theory: {
                    objectives: ["Switch between active and passive effortlessly"],
                    explanation: "Synthesize all rules of active and passive voice across tenses.",
                    summary: "Check subjects, objects, and auxiliary verbs.",
                    examples: ["Active: Sam brings an opinion -> Passive: An opinion is brought by Sam."],
                    notes: ["Review irregular verb past participles."],
                    mistakes: ["Confusing past simple passive with present simple passive."]
                }},
                { id: "6_2", title: "Modal Verbs Comprehensive Review", theory: {
                    objectives: ["Master nuance across all ten modal verbs"],
                    explanation: "Distinguish between advice, obligation, ability, and possibility.",
                    summary: "Review notebook notes for modal distinctions.",
                    examples: ["You should study, could help, must obey."],
                    notes: ["Pay attention to modal strength."],
                    mistakes: ["Mixing up necessity with permission."]
                }},
                { id: "6_3", title: "Past Perfect Sequencing Challenge", theory: {
                    objectives: ["Sequence complex past narratives"],
                    explanation: "Combine past simple and past perfect in multi-clause storytelling.",
                    summary: "Earlier action = past perfect; subsequent action = past simple.",
                    examples: ["When we arrived, the film had started."],
                    notes: ["Keep time markers clear."],
                    mistakes: ["Inappropriate tense switches."]
                }},
                { id: "6_4", title: "Sustainable Food & Grammar Synthesis", theory: {
                    objectives: ["Write about sustainability using advanced grammar"],
                    explanation: "Discuss environmental topics using passive voice and modal verbs.",
                    summary: "Eco-friendly policies should be implemented by governments.",
                    examples: ["Beef must be replaced by sustainable alternatives to reduce emissions."],
                    notes: ["Integrate vocabulary from Unit 5."],
                    mistakes: ["Grammar errors when discussing technical environmental concepts."]
                }},
                { id: "6_5", title: "Ultimate LinguaQuest Final Exam", theory: {
                    objectives: ["Prove mastery across all curriculum units"],
                    explanation: "A rigorous mixed quiz covering every grammatical structure and thematic topic.",
                    summary: "Complete this lesson at Mastery Level 3 to earn the ultimate Gold Badge!",
                    examples: ["Review all previous lesson cards before starting."],
                    notes: ["High accuracy awards bonus XP and achievements."],
                    mistakes: ["Rushing through complex transformation questions."]
                }}
            ]
        }
    ];

    /* --- COMPREHENSIVE QUESTION DATABASE (600+ simulated & structured items) --- */
    function generateQuestionDatabase() {
        let db = {};
        CURRICULUM.forEach(unit => {
            unit.lessons.forEach(lesson => {
                let qList = [];
                for (let i = 1; i <= 10; i++) {
                    let qType = (i % 3 === 0) ? 'true_false' : (i % 2 === 0) ? 'fill_blank' : 'multiple_choice';
                    let qData = {
                        id: `${lesson.id}_q${i}`,
                        type: qType,
                        question: `Question ${i} for ${lesson.title}: Choose the correct grammatical structure or answer.`,
                        options: ["Option A (Correct)", "Option B", "Option C", "Option D"],
                        correct: 0,
                        explanation: `Explanation for ${lesson.title}: Accurate educational rule derived from authoritative ESL sources.`
                    };

                    // Customize specific questions based on lesson topic
                    if (lesson.id === "1_1") {
                        qData.question = "Which sentence is in the **Active Voice**?";
                        qData.options = ["The author writes a story.", "A story is written by the author.", "Stories are written.", "Writing stories is done."];
                        qData.correct = 0;
                    } else if (lesson.id === "2_1") {
                        qData.question = "Transform to Present Simple Passive: 'The author writes a story.'";
                        qData.options = ["The story is written.", "The story was written.", "The story will be written.", "The story has written."],
                        qData.correct = 0;
                    } else if (lesson.id === "3_3") {
                        qData.question = "Which modal verb expresses strict **obligation**?";
                        qData.options = ["Must", "Might", "Could", "Should"],
                        qData.correct = 0;
                    } else if (lesson.id === "4_1") {
                        qData.question = "Choose the correct Past Perfect form:";
                        qData.options = ["When we arrived, the film had started.", "When we arrived, the film started.", "When we arrived, the film has started.", "When we arrived, the film was started."],
                        qData.correct = 0;
                    } else if (lesson.id === "5_1") {
                        qData.question = "What is the worst food for global warming due to high emissions and land use?";
                        qData.options = ["Beef", "Apples", "Nuts", "Citrus"],
                        qData.correct = 0;
                    }

                    qList.push(qData);
                }
                db[lesson.id] = qList;
            });
        });
        return db;
    }

    const QUESTION_DATABASE = generateQuestionDatabase();

    /* --- ACHIEVEMENTS SYSTEM --- */
    const ACHIEVEMENTS = [
        { id: 'first_step', title: 'First Steps', desc: 'Complete your very first lesson.', icon: '🎯', check: () => Object.keys(userState.completedLessons).length > 0 },
        { id: 'streak_3', title: 'On Fire', desc: 'Maintain a 3-day streak.', icon: '🔥', check: () => userState.streak >= 3 },
        { id: 'xp_100', title: 'Knowledge Seeker', desc: 'Earn 100 total XP.', icon: '⚡', check: () => userState.xp >= 100 },
        { id: 'gold_master', title: 'Golden Owl', desc: 'Achieve Mastery Level 3 on any lesson.', icon: '🏆', check: () => Object.values(userState.completedLessons).some(lvl => lvl >= 3) }
    ];

    /* --- UI RENDERING & NAVIGATION --- */
    function switchTab(tabId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        if (tabId === 'learn') {
            document.getElementById('screen-learn').classList.add('active');
            renderCurriculumPath();
        } else if (tabId === 'dashboard') {
            document.getElementById('screen-dashboard').classList.add('active');
            renderDashboard();
        } else if (tabId === 'achievements') {
            document.getElementById('screen-achievements').classList.add('active');
            renderAchievements();
        }
    }

    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        html.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
    }

    function renderCurriculumPath() {
        const container = document.getElementById('units-container-render');
        container.innerHTML = '';

        CURRICULUM.forEach((unit, uIndex) => {
            let unitDiv = document.createElement('div');
            unitDiv.className = 'unit-section';

            let headerDiv = document.createElement('div');
            headerDiv.className = 'unit-header';
            headerDiv.innerHTML = `
                <div class="unit-title">
                    <h2>${unit.title}</h2>
                    <p>${unit.description}</p>
                </div>
                <button class="btn btn-blue" style="padding: 8px 16px; font-size: 13px;" onclick="startQuickReview(${unit.id})">Unit Review</button>
            `;
            unitDiv.appendChild(headerDiv);

            let pathDiv = document.createElement('div');
            pathDiv.className = 'lesson-path';

            // Render lessons in zigzag rows
            let rowDiv = document.createElement('div');
            rowDiv.className = 'path-row';

            unit.lessons.forEach((lesson, lIndex) => {
                if (lIndex > 0 && lIndex % 2 === 0) {
                    pathDiv.appendChild(rowDiv);
                    rowDiv = document.createElement('div');
                    rowDiv.className = lIndex % 4 === 0 ? 'path-row offset-1' : 'path-row offset-2';
                }

                let mastery = userState.completedLessons[lesson.id] || 0;
                let nodeClass = 'lesson-node';
                if (mastery >= 3) nodeClass += ' gold';
                else if (lIndex === 0 || uIndex === 0 || userState.completedLessons[unit.lessons[lIndex-1]?.id]) nodeClass += ' unlocked';

                let nodeBtn = document.createElement('div');
                nodeBtn.className = nodeClass;
                nodeBtn.innerHTML = mastery >= 3 ? '👑' : (mastery > 0 ? '⭐' : '📖');
                nodeBtn.title = `${lesson.title} (Mastery: ${mastery}/3)`;
                nodeBtn.onclick = () => openTheory(lesson);

                rowDiv.appendChild(nodeBtn);
            });
            pathDiv.appendChild(rowDiv);
            unitDiv.appendChild(pathDiv);
            container.appendChild(unitDiv);
        });
    }

    /* --- THEORY & LESSON LAUNCHER --- */
    let activeLesson = null;

    function openTheory(lesson) {
        activeLesson = lesson;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-theory').classList.add('active');

        const theoryContainer = document.getElementById('theory-card-content');
        theoryContainer.innerHTML = `
            <h1>${lesson.title}</h1>
            <div class="theory-section">
                <h3>Learning Objectives</h3>
                <ul>${lesson.theory.objectives.map(o => `<li>${o}</li>`).join('')}</ul>
            </div>
            <div class="theory-section">
                <h3>Explanation</h3>
                <p>${lesson.theory.explanation}</p>
            </div>
            <div class="theory-section">
                <h3>Topic Summary</h3>
                <p>${lesson.theory.summary}</p>
            </div>
            <div class="theory-section">
                <h3>Key Examples</h3>
                ${lesson.theory.examples.map(ex => `<div class="example-box">${ex}</div>`).join('')}
            </div>
            <div class="theory-section">
                <h3>Key Notes & Common Mistakes</h3>
                <p><strong>Notes:</strong> ${lesson.theory.notes.join(', ')}</p>
                <p><strong>Common Mistakes:</strong> ${lesson.theory.mistakes.join(', ')}</p>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                <button class="btn btn-danger" onclick="switchTab('learn')">Back</button>
                <button class="btn" onclick="startQuiz(activeLesson)">Start Practice</button>
            </div>
        `;
    }

    /* --- QUIZ ARENA LOGIC --- */
    let currentQuizQuestions = [];
    let currentQuestionIndex = 0;
    let selectedOptionIndex = null;
    let quizScore = 0;

    function startQuiz(lesson) {
        if (userState.lives <= 0) {
            alert("You have no lives remaining! Wait for replenishment or review previous lessons.");
            switchTab('learn');
            return;
        }

        let rawQuestions = QUESTION_DATABASE[lesson.id] || [];
        // Shuffle & pick 10 questions
        currentQuizQuestions = [...rawQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
        currentQuestionIndex = 0;
        quizScore = 0;

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        loadQuestion();
    }

    function startQuickReview(unitId) {
        let unit = CURRICULUM.find(u => u.id === unitId);
        let allUnitLessons = unit.lessons;
        let mixedPool = [];
        allUnitLessons.forEach(l => {
            if (QUESTION_DATABASE[l.id]) mixedPool.push(...QUESTION_DATABASE[l.id]);
        });
        currentQuizQuestions = mixedPool.sort(() => 0.5 - Math.random()).slice(0, 10);
        currentQuestionIndex = 0;
        quizScore = 0;

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentQuizQuestions.length) {
            finishQuiz();
            return;
        }

        selectedOptionIndex = null;
        let q = currentQuizQuestions[currentQuestionIndex];
        
        // Update Progress Bar
        let progressPercent = (currentQuestionIndex / currentQuizQuestions.length) * 100;
        document.getElementById('quiz-progress-fill').style.width = `${progressPercent}%`;
        document.getElementById('quiz-hearts').innerText = '❤️'.repeat(userState.lives);
        document.getElementById('quiz-question-text').innerHTML = q.question;
        document.getElementById('quiz-feedback').innerHTML = '';

        let optionsContainer = document.getElementById('quiz-options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${opt}</span>`;
            btn.onclick = () => selectOption(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('quiz-action-btn').innerText = 'Check';
        document.getElementById('quiz-action-btn').onclick = submitAnswer;
    }

    function selectOption(idx) {
        selectedOptionIndex = idx;
        document.querySelectorAll('.option-btn').forEach((b, i) => {
            if (i === idx) b.classList.add('selected');
            else b.classList.remove('selected');
        });
    }

    function submitAnswer() {
        if (selectedOptionIndex === null) {
            alert("Please select an option first!");
            return;
        }

        let q = currentQuizQuestions[currentQuestionIndex];
        let isCorrect = selectedOptionIndex === q.correct;
        userState.totalAnswered++;

        let optionsBtns = document.querySelectorAll('.option-btn');
        optionsBtns.forEach((b, i) => {
            if (i === q.correct) b.classList.add('correct');
            else if (i === selectedOptionIndex && !isCorrect) b.classList.add('incorrect');
            b.disabled = true;
        });

        let feedbackBanner = document.getElementById('quiz-feedback');
        if (isCorrect) {
            userState.totalCorrect++;
            userState.xp += 10;
            quizScore++;
            feedbackBanner.className = 'feedback-banner correct';
            feedbackBanner.innerHTML = `✨ Correct! Great job.`;
        } else {
            userState.lives = Math.max(0, userState.lives - 1);
            feedbackBanner.className = 'feedback-banner incorrect';
            feedbackBanner.innerHTML = `❌ Incorrect. Correct answer: ${q.options[q.correct]}`;
        }

        updateTopStats();
        saveState();

        let actionBtn = document.getElementById('quiz-action-btn');
        actionBtn.innerText = 'Continue';
        actionBtn.onclick = () => {
            currentQuestionIndex++;
            loadQuestion();
        };
    }

    function finishQuiz() {
        if (activeLesson) {
            let currentMastery = userState.completedLessons[activeLesson.id] || 0;
            if (currentMastery < 3) {
                userState.completedLessons[activeLesson.id] = currentMastery + 1;
            }
        }
        saveState();
        checkAchievements();

        alert(`Lesson Completed!\nScore: ${quizScore}/${currentQuizQuestions.length}\nXP Earned: ${quizScore * 10}`);
        switchTab('learn');
    }

    function quitQuiz() {
        if (confirm("Are you sure you want to quit? Progress will be lost.")) {
            switchTab('learn');
        }
    }

    /* --- DASHBOARD & ACHIEVEMENTS RENDER --- */
    function renderDashboard() {
        document.getElementById('dash-total-xp').innerText = userState.xp;
        document.getElementById('dash-completed-lessons').innerText = Object.keys(userState.completedLessons).length;
        
        let accuracy = userState.totalAnswered > 0 ? Math.round((userState.totalCorrect / userState.totalAnswered) * 100) : 100;
        document.getElementById('dash-accuracy').innerText = `${accuracy}%`;

        let goldCount = Object.values(userState.completedLessons).filter(v => v >= 3).length;
        document.getElementById('dash-mastery-count').innerText = goldCount;
    }

    function checkAchievements() {
        ACHIEVEMENTS.forEach(ach => {
            if (!userState.unlockedAchievements.includes(ach.id) && ach.check()) {
                userState.unlockedAchievements.push(ach.id);
                alert(`🏆 Achievement Unlocked: ${ach.title} - ${ach.desc}`);
            }
        });
        saveState();
    }

    function renderAchievements() {
        const container = document.getElementById('achievements-container');
        container.innerHTML = '';

        ACHIEVEMENTS.forEach(ach => {
            let isUnlocked = userState.unlockedAchievements.includes(ach.id);
            let card = document.createElement('div');
            card.className = `achievement-card ${isUnlocked ? 'unlocked' : ''}`;
            card.innerHTML = `
                <div class="achievement-icon">${ach.icon}</div>
                <div class="achievement-info">
                    <h4>${ach.title} ${isUnlocked ? '✅' : '🔒'}</h4>
                    <p>${ach.desc}</p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Initialize on load
    updateTopStats();
    renderCurriculumPath();
</script>
