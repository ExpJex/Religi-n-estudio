<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicCamp | Dominando la Mecánica de Fluidos</title>
    <style>
        /* =========================================
           VARIABLES Y DISEÑO UX/UI (Estilo FreeCodeCamp)
           ========================================= */
        :root {
            --bg-main: #0a0a23;
            --bg-sidebar: #1b1b32;
            --bg-panel: #2a2a40;
            --text-main: #f5f6f7;
            --text-muted: #858591;
            --accent: #006400; /* FCC Green */
            --accent-hover: #004d00;
            --accent-blue: #002ead;
            --error: #a94442;
            --success: #3c763d;
            --border: #3b3b4f;
        }

        .light-mode {
            --bg-main: #ffffff;
            --bg-sidebar: #f5f6f7;
            --bg-panel: #e5e5e5;
            --text-main: #0a0a23;
            --text-muted: #3b3b4f;
            --border: #d0d0d5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* HEADER */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 50px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; }
        .logo { font-size: 1.2rem; font-weight: bold; }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .xp-display { background: var(--bg-main); padding: 5px 10px; border-radius: 4px; font-weight: bold; color: #ffbf00; border: 1px solid var(--border);}
        button { cursor: pointer; border: none; padding: 8px 15px; border-radius: 0; font-weight: bold; transition: 0.2s; }
        .btn-theme { background: var(--border); color: var(--text-main); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }

        /* LAYOUT PRINCIPAL */
        .app-container { display: flex; width: 100%; margin-top: 50px; height: calc(100vh - 50px); }

        /* SIDEBAR (Ruta de Aprendizaje) */
        .sidebar { width: 300px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding-bottom: 20px; }
        .level-header { background: var(--bg-panel); padding: 10px 15px; font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid var(--border); position: sticky; top: 0; cursor: pointer;}
        .step-item { padding: 10px 15px 10px 30px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center;}
        .step-item:hover { background-color: var(--bg-panel); }
        .step-item.active { border-left: 5px solid var(--accent); background-color: var(--bg-panel); padding-left: 25px; }
        .step-item.locked { color: var(--text-muted); cursor: not-allowed; }
        .icon-status { font-size: 1rem; }

        /* CONTENIDO PRINCIPAL */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; line-height: 1.6; }
        .content-wrapper { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        h2 { font-size: 1.5rem; margin: 20px 0 10px; color: var(--accent); }
        p { margin-bottom: 15px; font-size: 1.1rem; }
        .formula-box { background: var(--bg-panel); border-left: 4px solid var(--accent); padding: 15px; margin: 20px 0; font-family: monospace; font-size: 1.2rem; }
        
        /* HERRAMIENTAS LATERALES DERECHAS */
        .tools-panel { width: 280px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .tool-card { background: var(--bg-panel); border: 1px solid var(--border); padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .tool-card h3 { font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px;}
        .density-list { list-style: none; }
        .density-list li { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .calc-input { width: 100%; padding: 8px; margin-bottom: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); }
        .calc-result { font-weight: bold; color: var(--accent); text-align: center; margin-top: 10px; }

        /* QUIZ Y EXÁMENES (Estilo del Profesor Edgar) */
        .quiz-container { background: var(--bg-panel); padding: 25px; border: 1px solid var(--border); margin-top: 20px; }
        .option-label { display: block; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .option-label:hover { border-color: var(--accent); }
        input[type="radio"] { margin-right: 10px; }
        .justification-box { margin-top: 15px; }
        .justification-box textarea { width: 100%; height: 80px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 10px; resize: vertical; }
        .feedback { display: none; padding: 15px; margin-top: 15px; font-weight: bold; border-radius: 4px; }
        .feedback.correct { background: var(--success); color: white; display: block; }
        .feedback.incorrect { background: var(--error); color: white; display: block; }

        /* LABORATORIO VIRTUAL */
        .lab-container { border: 2px solid var(--border); padding: 20px; border-radius: 10px; background: #111; position: relative; height: 300px; display: flex; align-items: flex-end; justify-content: space-around; margin-bottom: 20px;}
        .beaker { width: 100px; height: 200px; border: 3px solid rgba(255,255,255,0.5); border-top: none; border-radius: 0 0 10px 10px; position: relative; display:flex; flex-direction: column; justify-content: flex-end; overflow: hidden;}
        .fluid { width: 100%; transition: height 0.5s; }
        .water { background: rgba(0, 150, 255, 0.6); }
        .oil { background: rgba(255, 215, 0, 0.6); }
        .sea-water { background: rgba(0, 100, 200, 0.8); }
        .object { width: 40px; height: 40px; background: #ccc; border-radius: 5px; position: absolute; left: 50%; transform: translateX(-50%); transition: bottom 1s cubic-bezier(0.25, 0.1, 0.25, 1); display: flex; justify-content: center; align-items: center; font-weight: bold; color: black; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}

        /* UTILS */
        .hidden { display: none !important; }
        img.exam-ref { max-width: 100%; border: 1px solid var(--border); margin: 15px 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo">PhysicCamp <span style="font-weight: normal; font-size:0.9rem;">| Grado 9°</span></div>
        <div class="header-controls">
            <div class="xp-display"><span id="xp-counter">0</span> XP</div>
            <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
            <button class="btn-primary" onclick="resetProgress()">Reiniciar Progreso</button>
        </div>
    </header>

    <div class="app-container">
        <!-- BARRA LATERAL (250 PASOS) -->
        <aside class="sidebar" id="sidebar">
            <!-- Generado dinámicamente por JS -->
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="content-wrapper" id="content-area">
                <!-- Generado dinámicamente por JS -->
            </div>
            <div style="margin-top: 30px; display: flex; justify-content: space-between;">
                <button id="btn-prev" class="btn-theme hidden" onclick="navigate(-1)">← Anterior</button>
                <button id="btn-next" class="btn-primary hidden" onclick="checkAndAdvance()">Siguiente / Comprobar →</button>
            </div>
        </main>

        <!-- PANEL DE HERRAMIENTAS -->
        <aside class="tools-panel">
            <div class="tool-card">
                <h3>🧠 Densidades Obligatorias</h3>
                <ul class="density-list">
                    <li><span>Agua dulce:</span> <span>1000 kg/m³</span></li>
                    <li><span>Agua de mar:</span> <span>1025 kg/m³</span></li>
                    <li><span>Aceite:</span> <span>900 kg/m³</span></li>
                    <li><span>Mercurio:</span> <span>13600 kg/m³</span></li>
                </ul>
                <p style="font-size: 0.8rem; margin-top:10px; color:var(--text-muted)">*Memoriza estos valores para los exámenes.</p>
            </div>

            <div class="tool-card">
                <h3>🧮 Calculadora de Presión</h3>
                <p style="font-size: 0.8rem; color:var(--text-muted)">P = F / A</p>
                <input type="number" id="calc-f" class="calc-input" placeholder="Fuerza (N)">
                <input type="number" id="calc-a" class="calc-input" placeholder="Área (m²)">
                <button class="btn-theme" style="width:100%" onclick="calculatePressure()">Calcular</button>
                <div id="res-pressure" class="calc-result"></div>
            </div>

            <div class="tool-card">
                <h3>🌊 Calc. Presión Hidrostática</h3>
                <p style="font-size: 0.8rem; color:var(--text-muted)">Ph = d × g × h (g=10m/s²)</p>
                <input type="number" id="calc-d" class="calc-input" placeholder="Densidad (kg/m³)">
                <input type="number" id="calc-h" class="calc-input" placeholder="Profundidad (m)">
                <button class="btn-theme" style="width:100%" onclick="calculateHydro()">Calcular</button>
                <div id="res-hydro" class="calc-result"></div>
            </div>
        </aside>
    </div>

    <script>
        /* =========================================
           ESTADO DE LA APLICACIÓN Y DATOS
           ========================================= */
        let state = {
            currentStep: 1,
            xp: 0,
            completedSteps: []
        };

        const levels = [
            { id: 1, name: "Nivel 1: Fundamentos", start: 1, end: 50 },
            { id: 2, name: "Nivel 2: Densidad y Volumen", start: 51, end: 100 },
            { id: 3, name: "Nivel 3: Presión Mecánica", start: 101, end: 140 },
            { id: 4, name: "Nivel 4: Fluidos e Hidrostática", start: 141, end: 190 },
            { id: 5, name: "Nivel 5: Arquímedes y Bernoulli", start: 191, end: 230 },
            { id: 6, name: "Nivel 6: Dominio Total", start: 231, end: 250 }
        ];

        // Base de datos del currículo (250 pasos)
        const curriculum = {};

        // Función constructora para rellenar los 250 pasos por defecto
        function initializeCurriculum() {
            for (let i = 1; i <= 250; i++) {
                curriculum[i] = {
                    title: `Paso ${i}: Lección en desarrollo`,
                    type: 'theory',
                    content: `<p>Este es el marcador de posición para el paso ${i}. En la plataforma completa, este espacio contendrá teoría, ejercicios o talleres acumulativos.</p>`
                };
            }

            // ==========================================
            // SOBREESCRIBIR PASOS CLAVE (Requerimientos del Prompt)
            // ==========================================

            // PASO 1: Teoría Básica
            curriculum[1] = {
                title: "Conceptos Básicos: Masa, Volumen y Densidad",
                type: "theory",
                content: `
                    <h1>Introducción a las Propiedades de la Materia</h1>
                    <p>Bienvenido a PhysicCamp. Para entender los fluidos, primero debemos entender de qué están hechos.</p>
                    <ul>
                        <li><strong>Masa (m):</strong> Cantidad de materia. Se mide en Kilogramos (kg).</li>
                        <li><strong>Volumen (v):</strong> Espacio que ocupa esa materia. Se mide en metros cúbicos (m³).</li>
                    </ul>
                    <h2>La Densidad (d ó ρ)</h2>
                    <p>La densidad es la relación directa entre la masa y el volumen de un cuerpo. Nos dice qué tan "compacta" está la materia.</p>
                    <div class="formula-box">d = m / v</div>
                    <p><strong>Unidades del SI:</strong> kg/m³ (Kilogramo por metro cúbico).</p>
                    <p><em>Regla de oro:</em> Si un objeto es menos denso que el fluido en el que está, <strong>flotará</strong>. Si es más denso, se <strong>hundirá</strong>.</p>
                `
            };

            // PASO 10: Pregunta Recreada del Examen (Imagen 2)
            curriculum[10] = {
                title: "Taller Acumulativo: Análisis de Densidad y Flotación",
                type: "quiz",
                content: `
                    <h1>Evaluación Formativa (Estilo ICFES / Examen Docente)</h1>
                    <p>Analiza la siguiente situación basada en evaluaciones reales.</p>
                    <div class="quiz-container">
                        <h3>Pregunta 7 (Ref. Examen Edgar Gómez)</h3>
                        <p>Si se coloca un objeto con densidad de <strong>800 kg/m³</strong> en el mar Muerto (cuya densidad aproximada es <strong>1200 kg/m³</strong>), ¿cuál será su ubicación?</p>
                        
                        <label class="option-label"><input type="radio" name="q1" value="A"> A. Flotará porque es menos denso que el agua del mar Muerto.</label>
                        <label class="option-label"><input type="radio" name="q1" value="B"> B. Flotará porque es más denso que el agua del mar Muerto.</label>
                        <label class="option-label"><input type="radio" name="q1" value="C"> C. Permanecerá suspendido porque su densidad es muy similar.</label>
                        <label class="option-label"><input type="radio" name="q1" value="D"> D. Se sumergirá hasta el fondo porque es más denso.</label>

                        <div class="justification-box">
                            <p><strong>Justificación (OBLIGATORIA):</strong> Demuestra matemáticamente o conceptualmente tu respuesta.</p>
                            <textarea id="justification" placeholder="Escribe aquí tu justificación. Ej: d_objeto < d_fluido..."></textarea>
                        </div>
                    </div>
                `,
                correctAnswer: "A",
                justificationKeywords: ["800", "1200", "<", "menor", "densidad"]
            };

            // PASO 30: Presión Mecánica (Imagen 3)
            curriculum[30] = {
                title: "Presión en Sólidos (Área de Contacto)",
                type: "theory",
                content: `
                    <h1>Presión (P)</h1>
                    <p>La presión indica cómo se distribuye una Fuerza sobre una Superficie (Área).</p>
                    <div class="formula-box">P = F / A</div>
                    <p>Se mide en Pascales (Pa), donde 1 Pa = 1 Newton / 1 m².</p>
                    <h2>Análisis de la Gráfica (Ref. Imagen 3)</h2>
                    <p>Observa que la presión es <strong>inversamente proporcional</strong> al área. A mayor área de apoyo, menor presión generada por el mismo peso.</p>
                    <p>Si un bloque de peso <em>w</em> genera 3000 Pa en el área A2. Si lo apoyamos en un área A1 que es más pequeña, la presión será <strong>mayor</strong>.</p>
                `
            };

            // PASO 150: Laboratorio Virtual (Flotación e Hidrostática)
            curriculum[150] = {
                title: "Laboratorio Virtual 12: Presión Hidrostática",
                type: "lab",
                content: `
                    <h1>Laboratorio: Principio de la Presión Hidrostática</h1>
                    <p>La presión hidrostática depende exclusivamente de la densidad del fluido, la gravedad y la <strong>profundidad</strong>.</p>
                    <div class="formula-box">Ph = d × g × h</div>
                    
                    <div class="controls">
                        <button class="btn-theme" onclick="labChangeFluid('water', 1000)">Agua (1000 kg/m³)</button>
                        <button class="btn-theme" onclick="labChangeFluid('sea-water', 1025)">Mar (1025 kg/m³)</button>
                        <button class="btn-theme" onclick="labChangeFluid('oil', 900)">Aceite (900 kg/m³)</button>
                    </div>
                    <div class="controls">
                        <button class="btn-primary" onclick="labDropCoin('top')">Sumergir a -5m</button>
                        <button class="btn-primary" onclick="labDropCoin('bottom')">Sumergir a -15m</button>
                    </div>

                    <div class="lab-container">
                        <div class="beaker" id="lab-beaker">
                            <div class="fluid water" id="lab-fluid" style="height: 100%;"></div>
                            <div class="object" id="lab-coin" style="bottom: 100%;">🪙</div>
                        </div>
                        <div style="color: white; font-family: monospace;">
                            <p>Fluido Actual: <span id="lab-fluid-name">Agua</span></p>
                            <p>Densidad (d): <span id="lab-d">1000</span> kg/m³</p>
                            <p>Profundidad (h): <span id="lab-h">0</span> m</p>
                            <p>Gravedad (g): 10 m/s²</p>
                            <hr style="border-color:#333; margin:10px 0;">
                            <p style="color:var(--accent); font-size:1.2rem;">Presión: <span id="lab-p">0</span> Pa</p>
                        </div>
                    </div>
                    <p><strong>Observación:</strong> Como en la pregunta de las monedas (Imagen 2 y 3), a mayor profundidad, mayor columna de líquido hay sobre el objeto, por tanto, la presión aumenta linealmente.</p>
                `
            };

            // PASO 200: Recreación Examen - Cálculo de Presión (Imagen 2 - Corrección del error del estudiante)
            curriculum[200] = {
                title: "Análisis de Casos: El Submarino en el Mar Muerto",
                type: "quiz",
                content: `
                    <h1>Resolución de Problemas Complejos</h1>
                    <div class="quiz-container">
                        <h3>Problema 8 (Ref. Examen Edgar Gómez)</h3>
                        <p>Si un submarino de 4500 kg de masa se sumerge en el mar muerto (Densidad = 1240 kg/m³) a una profundidad de 10 metros, el valor de la presión hidrostática soportada por el submarino es de: (Asume g = 10 m/s²)</p>
                        
                        <p style="color:var(--text-muted); font-size:0.9rem;"><em>Nota del profesor: Cuidado con los datos trampa. ¿La masa del submarino afecta la presión hidrostática del agua exterior? Revisa la fórmula P = d·g·h.</em></p>

                        <label class="option-label"><input type="radio" name="q2" value="A"> A. 450,000 Pascales</label>
                        <label class="option-label"><input type="radio" name="q2" value="B"> B. 124,000 Pascales</label>
                        <label class="option-label"><input type="radio" name="q2" value="C"> C. 12,400 Pascales</label>
                        <label class="option-label"><input type="radio" name="q2" value="D"> D. 125,000 Pascales</label>

                        <div class="justification-box">
                            <p><strong>Justificación (OBLIGATORIA):</strong> Realiza el cálculo.</p>
                            <textarea id="justification" placeholder="P = d * g * h = ..."></textarea>
                        </div>
                    </div>
                `,
                correctAnswer: "B",
                justificationKeywords: ["1240", "10", "124000", "masa no", "trampa"]
            };

            // PASO 250: EXAMEN FINAL
            curriculum[250] = {
                title: "Certificación Final: Dominio de Fluidos",
                type: "theory", // Usamos theory para el portal de inicio del examen
                content: `
                    <div style="text-align: center; padding: 40px;">
                        <h1 style="font-size: 3rem; color: var(--accent);">Examen Final de Certificación</h1>
                        <p>Has completado 249 pasos. Este es tu reto final.</p>
                        <ul style="text-align: left; display: inline-block; background: var(--bg-panel); padding: 20px; border-radius: 10px; border: 1px solid var(--border);">
                            <li><strong>Preguntas:</strong> 100 (Teóricas, Prácticas, ICFES, Laboratorio)</li>
                            <li><strong>Tiempo Límite:</strong> 3 Horas</li>
                            <li><strong>Puntuación de Aprobación:</strong> 85% Mínimo</li>
                            <li><strong>Requisito:</strong> Justificación obligatoria en cálculos.</li>
                        </ul>
                        <br><br>
                        <button class="btn-primary" style="font-size: 1.5rem; padding: 15px 40px;" onclick="alert('Iniciando entorno seguro de evaluación. ¡Éxitos!')">COMENZAR EXAMEN FINAL</button>
                    </div>
                `
            };
        }

        /* =========================================
           LÓGICA DE INTERFAZ Y RENDERIZADO
           ========================================= */
        function initApp() {
            initializeCurriculum();
            loadState();
            renderSidebar();
            loadStep(state.currentStep);
            updateXP();
        }

        function loadState() {
            const saved = localStorage.getItem('physicCampState');
            if (saved) {
                state = JSON.parse(saved);
            }
        }

        function saveState() {
            localStorage.setItem('physicCampState', JSON.stringify(state));
            updateXP();
        }

        function resetProgress() {
            if(confirm("¿Estás seguro de reiniciar todo tu progreso?")) {
                state = { currentStep: 1, xp: 0, completedSteps: [] };
                saveState();
                renderSidebar();
                loadStep(1);
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function updateXP() {
            document.getElementById('xp-counter').innerText = state.xp;
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            levels.forEach(level => {
                // Header del nivel
                const header = document.createElement('div');
                header.className = 'level-header';
                header.innerHTML = `${level.name} <span style="float:right;">▼</span>`;
                sidebar.appendChild(header);

                // Pasos del nivel
                for (let i = level.start; i <= level.end; i++) {
                    const stepDiv = document.createElement('div');
                    const isCompleted = state.completedSteps.includes(i);
                    const isLocked = i > state.currentStep && !state.completedSteps.includes(i) && i !== 1;
                    
                    stepDiv.className = `step-item ${i === state.currentStep ? 'active' : ''} ${isLocked ? 'locked' : ''}`;
                    stepDiv.onclick = () => { if (!isLocked) loadStep(i); };

                    let icon = isLocked ? '🔒' : (isCompleted ? '✅' : '▶️');
                    
                    stepDiv.innerHTML = `<span>${i}. ${curriculum[i].title.substring(0, 22)}...</span> <span class="icon-status">${icon}</span>`;
                    sidebar.appendChild(stepDiv);
                }
            });
        }

        function loadStep(id) {
            state.currentStep = id;
            const contentArea = document.getElementById('content-area');
            const data = curriculum[id];
            
            // Renderizar contenido base
            contentArea.innerHTML = `<span style="color:var(--text-muted); font-size:0.9rem;">Ruta de Aprendizaje > Paso ${id} de 250</span>` + data.content;
            
            // Botones de navegación
            document.getElementById('btn-prev').classList.toggle('hidden', id === 1);
            
            const btnNext = document.getElementById('btn-next');
            btnNext.classList.remove('hidden');
            
            if (data.type === 'theory' || data.type === 'lab') {
                btnNext.innerText = "Completar y Continuar →";
                btnNext.onclick = () => completeStep(id);
            } else if (data.type === 'quiz') {
                btnNext.innerText = "Comprobar Respuesta ✓";
                btnNext.onclick = () => checkQuiz(id);
            }

            // Actualizar Sidebar UI visualmente sin recargar todo
            renderSidebar();
            
            // Scroll top
            document.querySelector('.main-content').scrollTop = 0;
        }

        function completeStep(id) {
            if (!state.completedSteps.includes(id)) {
                state.completedSteps.push(id);
                state.xp += 10; // 10 XP por lección/lab
                saveState();
            }
            if (id < 250) {
                loadStep(id + 1);
            }
        }

        function checkQuiz(id) {
            const data = curriculum[id];
            const radios = document.querySelectorAll('input[type="radio"]:checked');
            const justification = document.getElementById('justification').value.toLowerCase();
            
            // Remover feedback anterior
            const oldFb = document.querySelector('.feedback');
            if(oldFb) oldFb.remove();

            const fbDiv = document.createElement('div');
            fbDiv.className = 'feedback';

            if (radios.length === 0) {
                fbDiv.className += ' incorrect';
                fbDiv.innerText = "⚠️ Debes seleccionar una opción.";
                document.querySelector('.quiz-container').appendChild(fbDiv);
                return;
            }

            if (justification.length < 10) {
                fbDiv.className += ' incorrect';
                fbDiv.innerText = "⚠️ El profesor exige una justificación válida de al menos 10 caracteres.";
                document.querySelector('.quiz-container').appendChild(fbDiv);
                return;
            }

            const answer = radios[0].value;
            
            // Validar respuesta
            if (answer === data.correctAnswer) {
                // Validar si la justificación tiene sentido (básico)
                let hasKeywords = data.justificationKeywords.some(kw => justification.includes(kw));
                
                if (hasKeywords) {
                    fbDiv.className += ' correct';
                    fbDiv.innerHTML = "¡Correcto! Excelente análisis físico. +50 XP <br><br> <em>Feedback Docente: La densidad es el factor determinante. Aplicaste correctamente la fórmula.</em>";
                    if (!state.completedSteps.includes(id)) {
                        state.completedSteps.push(id);
                        state.xp += 50; // 50 XP por quiz superado
                        saveState();
                    }
                    
                    const btnNext = document.getElementById('btn-next');
                    btnNext.innerText = "Siguiente Lección →";
                    btnNext.onclick = () => { if (id < 250) loadStep(id + 1); };

                } else {
                    fbDiv.className += ' incorrect';
                    fbDiv.innerText = "Tu respuesta es correcta, pero tu justificación matemática/conceptual no parece adecuada. Revisa tus cálculos o conceptos.";
                }
            } else {
                fbDiv.className += ' incorrect';
                fbDiv.innerText = "Respuesta incorrecta. Revisa la teoría de la relación entre densidad y presión e inténtalo de nuevo.";
            }

            document.querySelector('.quiz-container').appendChild(fbDiv);
        }

        function navigate(dir) {
            const next = state.currentStep + dir;
            if (next >= 1 && next <= 250) loadStep(next);
        }

        /* =========================================
           LÓGICA DEL LABORATORIO VIRTUAL (Paso 150)
           ========================================= */
        let currentLabFluidD = 1000;
        function labChangeFluid(className, density) {
            const fluidElement = document.getElementById('lab-fluid');
            if(fluidElement){
                fluidElement.className = `fluid ${className}`;
                document.getElementById('lab-fluid-name').innerText = className === 'water' ? 'Agua' : (className === 'sea-water' ? 'Mar' : 'Aceite');
                document.getElementById('lab-d').innerText = density;
                currentLabFluidD = density;
                updateLabPressure();
            }
        }

        function labDropCoin(depth) {
            const coin = document.getElementById('lab-coin');
            const hSpan = document.getElementById('lab-h');
            if(coin) {
                if(depth === 'top') {
                    coin.style.bottom = '75%'; // Simula 5m
                    hSpan.innerText = '5';
                } else {
                    coin.style.bottom = '25%'; // Simula 15m
                    hSpan.innerText = '15';
                }
                setTimeout(updateLabPressure, 1000); // Esperar animación
            }
        }

        function updateLabPressure() {
            const h = parseInt(document.getElementById('lab-h').innerText);
            const p = currentLabFluidD * 10 * h; // P = d * g * h
            document.getElementById('lab-p').innerText = p.toLocaleString();
        }

        /* =========================================
           LÓGICA DE HERRAMIENTAS LATERALES
           ========================================= */
        function calculatePressure() {
            const f = parseFloat(document.getElementById('calc-f').value);
            const a = parseFloat(document.getElementById('calc-a').value);
            const res = document.getElementById('res-pressure');
            if(f && a) {
                res.innerText = (f/a).toFixed(2) + " Pa";
            } else {
                res.innerText = "Ingresa datos";
            }
        }

        function calculateHydro() {
            const d = parseFloat(document.getElementById('calc-d').value);
            const h = parseFloat(document.getElementById('calc-h').value);
            const res = document.getElementById('res-hydro');
            if(d && h) {
                const p = d * 10 * h; // asumiendo g=10 como en el examen
                res.innerText = p.toLocaleString() + " Pa";
            } else {
                res.innerText = "Ingresa datos";
            }
        }

        // Iniciar
        window.onload = initApp;

    </script>
</body>
</html>
